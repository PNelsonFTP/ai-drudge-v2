name: V2 refresh and deploy

# AI DRUDGE V2: fetch -> gate -> build -> deploy to GitHub Pages -> persist state.
#
# INERT BY DEFAULT. Every job is guarded by the repository variable V2_DEPLOY. Until the owner sets
# V2_DEPLOY=true (Settings > Secrets and variables > Actions > Variables) every job is skipped, so
# this file can sit in any repo or branch without building, deploying or pushing anything.
#
# Job graph:  guard -> build -> deploy -> persist
#                         \________\_________\____ alert (rolling issue: open / update / close)
#
#   guard    no token       scheduled runs only: skip when the live data is younger than 20 min
#   build    contents:read  preflight, npm ci, typecheck, tests, state restore, data build, gate, site build
#   deploy   pages + OIDC   deploy-pages with two retries; runs no repo code
#   persist  contents:write ONE orphan commit force-pushed to the `data` branch; never main
#   alert    issues:write   rolling issues: "V2 refresh failing" and "V2 Daily Brief failing"
#
# Nothing is ever committed to main. Generated data lives in the Pages artifact.
#
# Pipeline state (state.json: first-seen ledger, feed health, last-good items, river memory) is
# NOT part of the site. It is handed from build to build through the `data` branch: the persist
# job writes it, the next build's restore step reads it. It is the pipeline's memory, not client
# data, and at about 1 MB gzip it was most of the Pages artifact. Escape hatch: set the
# repository variable V2_PUBLISH_STATE=true and the state is also published with the site, which
# the restore step then uses as its fallback (as it does for any copy an older deployment left).
# A build that finds no state although the site is up says so in the "V2 refresh failing" issue.
#
# Deploy, persist and alert run from `main` only, and the site is built for SITE_BASE. The build
# job's preflight step fails loudly when either assumption is wrong (the repository's default
# branch is not main, or the repository name does not match SITE_BASE) instead of building
# every 30 minutes without ever deploying, or deploying a page whose assets all 404.

on:
  schedule:
    # Backstop clock. GitHub delivers scheduled runs late or not at all (about 20% of slots in
    # Oct-Nov 2026), so four offset slots are requested and the guard job drops any slot that
    # lands within 20 minutes of the last good build: at most two builds an hour from cron.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions: {}

# Unique to V2. Workflow-level concurrency is evaluated before any job `if:`, so this group must
# never share a name with V1's ("refresh-deploy"). Runs queue; an in-flight deploy is never cancelled.
concurrency:
  group: v2-refresh-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://pnelsonftp.github.io/ai-drudge-v2/' }}
  SITE_BASE: ${{ vars.SITE_BASE || '/ai-drudge-v2/' }}

jobs:
  # ------------------------------------------------------------------------------------------------
  guard:
    name: Skip if fresh (schedule only)
    if: vars.V2_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    outputs:
      skip: ${{ steps.fresh.outputs.skip }}
    steps:
      - name: Check the age of the live data
        id: fresh
        env:
          FRESH_MINUTES: "20"
        run: |
          set -euo pipefail
          skip=false
          # Manual / reconciler kicks and code pushes always build. Any error here means "build".
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            base="${SITE_URL%/}/"
            gen="$(curl -fsS --max-time 15 "${base}data/v2/status.json?t=$(date +%s)" | jq -r '.generatedAt // empty' 2>/dev/null || true)"
            if [[ "$gen" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$ ]]; then
              age=$(( ( $(date -u +%s) - $(date -u -d "$gen" +%s) ) / 60 ))
              echo "Live data generated at ${gen} (${age} min ago)"
              if [ "$age" -ge 0 ] && [ "$age" -lt "$FRESH_MINUTES" ]; then
                skip=true
                echo "Younger than ${FRESH_MINUTES} min - skipping this scheduled slot."
              fi
            else
              echo "No readable status.json on the live site - building."
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------------------------------------
  build:
    name: Build, test, gate
    needs: guard
    if: ${{ !cancelled() && vars.V2_DEPLOY == 'true' && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      failed_step: ${{ steps.verdict.outputs.failed_step }}
      state_lost: ${{ steps.restore.outputs.lost }}
      brief_alert: ${{ steps.gate.outputs.brief_alert }}
    steps:
      # Runs before anything is installed or fetched. Two silent traps, turned into red runs:
      #   1. Scheduled runs use the default branch. If that is not main, nothing below deploys,
      #      persists or alerts - the site would simply never update.
      #   2. On *.github.io the site lives under /<repository>/. A SITE_BASE that says otherwise
      #      deploys an index.html whose scripts and data all 404 (a blank page, green run).
      - name: Preflight (branch and site base)
        id: preflight
        run: |
          set -euo pipefail
          lc() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
              echo "::error title=wrong branch::scheduled runs execute on the default branch (${GITHUB_REF_NAME}), but deploy, persist and alert only run from main. Make main the default branch (or rename this branch to main); until then nothing is deployed."
              exit 1
            fi
            echo "::notice title=test build::${GITHUB_REF_NAME} is not main: this run builds and gates with the fallback brief, and deploys nothing."
          fi

          repo="${GITHUB_REPOSITORY#*/}"
          host="${SITE_URL#*://}"
          host="${host%%/*}"
          case "$(lc "$host")" in
            *.github.io)
              want="/${repo}/"
              # A user / organisation site (<owner>.github.io) is served from the root.
              if [ "$(lc "$repo")" = "$(lc "$host")" ]; then want="/"; fi
              if [ "$(lc "${SITE_BASE}")" != "$(lc "$want")" ]; then
                echo "::error title=site base::SITE_BASE is '${SITE_BASE}' but ${GITHUB_REPOSITORY} is served from '${want}' on ${host}. Set the repository variables SITE_BASE=${want} and SITE_URL=https://${host}${want} (Settings > Secrets and variables > Actions > Variables)."
                exit 1
              fi
              ;;
          esac
          echo "Preflight ok: ref ${GITHUB_REF}, SITE_URL ${SITE_URL}, SITE_BASE ${SITE_BASE}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install (lifecycle scripts disabled)
        id: install
        timeout-minutes: 5
        run: npm ci --ignore-scripts

      - name: Typecheck
        id: typecheck
        timeout-minutes: 5
        run: npm run typecheck

      - name: Unit tests
        id: test
        timeout-minutes: 5
        run: npm test

      # State (first-seen ledger, feed health, last-good items, lead) is handed from build to build.
      # PRIMARY: the `data` branch (written by the persist job of the previous run). FALLBACK: a
      # copy on the live site - there only when V2_PUBLISH_STATE=true publishes it, or left by an
      # older deployment. The fallback also wins when it is strictly newer (a run whose deploy
      # succeeded and whose persist failed). Neither: the build starts empty (first-run semantics),
      # and when the site is already up that is reported (output `lost`, then the failure issue).
      # The file is untrusted input to the pipeline, which re-validates every field; the only value
      # this step prints from it (savedAt) is printed only when it has the shape of a timestamp.
      - name: Restore pipeline state
        id: restore
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dest="public/data/v2/state.json"
          mkdir -p "$(dirname "$dest")"
          rm -f "$dest"
          tmp="${RUNNER_TEMP}/state-restore"
          mkdir -p "$tmp"
          rm -f "$tmp/branch.json" "$tmp/live.json"
          base="${SITE_URL%/}/"

          valid() { [ -s "$1" ] && jq -e 'type == "object" and .schemaVersion == 2' "$1" > /dev/null 2>&1; }
          saved_at() {
            jq -r '(.savedAt // "") | tostring | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,6})?Z$"))' "$1" 2> /dev/null || true
          }

          have_branch=0
          if git fetch --quiet --depth=1 --no-tags "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data 2> /dev/null \
            && git show FETCH_HEAD:state.json > "$tmp/branch.json" 2> /dev/null \
            && valid "$tmp/branch.json"; then
            have_branch=1
          else
            echo "Data branch: no valid schemaVersion 2 state.json on branch 'data'"
          fi

          have_live=0
          if curl -fsS --max-time 30 --retry 2 -o "$tmp/live.json" "${base}data/v2/state.json?t=$(date +%s)" 2> /dev/null \
            && valid "$tmp/live.json"; then
            have_live=1
          else
            echo "Live site: no state.json at ${base}data/v2/state.json (expected unless V2_PUBLISH_STATE=true)"
          fi

          source="none (starting empty)"
          if [ "$have_branch" = 1 ]; then
            cp "$tmp/branch.json" "$dest"
            source="data branch"
          fi
          if [ "$have_live" = 1 ]; then
            if [ "$have_branch" != 1 ] || [[ "$(saved_at "$tmp/live.json")" > "$(saved_at "$tmp/branch.json")" ]]; then
              cp "$tmp/live.json" "$dest"
              source="live site"
            fi
          fi

          detail=""
          lost=false
          if [ -s "$dest" ]; then
            when="$(saved_at "$dest")"
            detail=" (saved ${when:-at an unreadable time}, $(wc -c < "$dest" | tr -d ' ') bytes)"
          elif curl -fsS --max-time 15 -o /dev/null "${base}data/v2/status.json?t=$(date +%s)" 2> /dev/null; then
            # Not a first build: the site is up, yet no copy of the state could be used. The build
            # still runs, with first-run semantics - say so where the owner will see it.
            lost=true
            echo "::warning title=state restore::the live site is up but no valid state.json was found on the data branch or the live site - this build starts from empty state (first-seen times are re-stamped; feed failure streaks, river memory and conditional-GET validators are lost)"
          fi
          echo "State restored from: ${source}${detail}"
          echo "State restored from: **${source}**${detail}" >> "$GITHUB_STEP_SUMMARY"
          echo "source=${source}" >> "$GITHUB_OUTPUT"
          echo "lost=${lost}" >> "$GITHUB_OUTPUT"

      # The gate compares generatedAt with this; it must be taken BEFORE the data build.
      - name: Record build start
        run: echo "BUILD_STARTED_AT=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"

      # The only step that holds the API key, and only on main: a workflow_dispatch on any other
      # ref runs that ref's code, so it builds with the deterministic brief instead. Inside the
      # step the pipeline hands the key to the brief stage alone and removes it from the process
      # environment before it fetches or parses a single feed (scripts/pipeline/run.ts).
      # Hard 12-minute ceiling (exit 124 fails the step). Step output `outcome`: written | kept-previous.
      - name: Build data
        id: data
        timeout-minutes: 14
        env:
          ANTHROPIC_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.ANTHROPIC_API_KEY || '' }}
          FEED_USER_AGENT: ${{ vars.FEED_USER_AGENT }}
        run: timeout --kill-after=30s 12m npm run build:data

      # Exit 0 = publish, exit 1 = hold (nothing is uploaded, the previous deploy keeps serving).
      - name: Freshness and quality gate
        id: gate
        timeout-minutes: 3
        run: npx --no-install tsx scripts/tools/check-data.ts --write-status

      - name: Build site
        id: site
        timeout-minutes: 5
        run: npm run build

      # The site is published without the pipeline state unless V2_PUBLISH_STATE=true. Either way
      # the state must exist next to the data: the state artifact (and so the data branch, the
      # only way to the next build by default) is made from it.
      - name: Check dist
        id: distcheck
        env:
          PUBLISH_STATE: ${{ vars.V2_PUBLISH_STATE }}
        run: |
          set -euo pipefail
          for f in index.html data/v2/front.json data/v2/status.json; do
            if [ ! -s "dist/$f" ]; then
              echo "::error title=dist check::dist/$f is missing or empty - not deploying"
              exit 1
            fi
          done
          if [ ! -s public/data/v2/state.json ]; then
            echo "::error title=dist check::public/data/v2/state.json is missing or empty - the next build would start from nothing; not deploying"
            exit 1
          fi
          if [ "${PUBLISH_STATE}" = "true" ]; then
            echo "V2_PUBLISH_STATE=true: state.json is published with the site ($(wc -c < dist/data/v2/state.json | tr -d ' ') bytes)."
          else
            rm -f dist/data/v2/state.json
            if [ -e dist/data/v2/state.json ]; then
              echo "::error title=dist check::could not remove dist/data/v2/state.json"
              exit 1
            fi
            echo "state.json is not part of the site; it reaches the next build through the data branch."
          fi

      - name: Upload Pages artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Upload state artifact
        id: state_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v2-state
          path: |
            public/data/v2/state.json
            public/data/v2/status.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Record which step failed
        id: verdict
        if: ${{ failure() }}
        env:
          O_PREFLIGHT: ${{ steps.preflight.outcome }}
          DATA_OUTCOME: ${{ steps.data.outputs.outcome }}
          O_INSTALL: ${{ steps.install.outcome }}
          O_TYPECHECK: ${{ steps.typecheck.outcome }}
          O_TEST: ${{ steps.test.outcome }}
          O_RESTORE: ${{ steps.restore.outcome }}
          O_DATA: ${{ steps.data.outcome }}
          O_GATE: ${{ steps.gate.outcome }}
          O_SITE: ${{ steps.site.outcome }}
          O_DISTCHECK: ${{ steps.distcheck.outcome }}
          O_PAGES_ARTIFACT: ${{ steps.pages_artifact.outcome }}
          O_STATE_ARTIFACT: ${{ steps.state_artifact.outcome }}
        run: |
          step="setup (checkout or Node)"
          if   [ "$O_PREFLIGHT" = failure ]; then step="preflight (wrong branch, or SITE_BASE does not match the repository)"
          elif [ "$O_INSTALL" = failure ]; then step="npm ci"
          elif [ "$O_TYPECHECK" = failure ]; then step="typecheck"
          elif [ "$O_TEST" = failure ]; then step="unit tests"
          elif [ "$O_RESTORE" = failure ]; then step="state restore"
          elif [ "$O_DATA" = failure ]; then step="data build (pipeline error or 12-minute timeout)"
          elif [ "$O_GATE" = failure ] && [ "$DATA_OUTCOME" = kept-previous ]; then step="data gate (hold): zero articles - no source produced a usable item, so the pipeline wrote nothing"
          elif [ "$O_GATE" = failure ]; then step="data gate (hold)"
          elif [ "$O_SITE" = failure ]; then step="site build"
          elif [ "$O_DISTCHECK" = failure ]; then step="dist check"
          elif [ "$O_PAGES_ARTIFACT" = failure ]; then step="Pages artifact upload"
          elif [ "$O_STATE_ARTIFACT" = failure ]; then step="state artifact upload"
          fi
          echo "Failed step: ${step}"
          echo "failed_step=${step}" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ !cancelled() && vars.V2_DEPLOY == 'true' && github.ref == 'refs/heads/main' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy3.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      # Normal deploys take 7-45 s. A 2-minute ceiling makes a stuck deployment abort and
      # self-cancel instead of blocking the concurrency group for the 10-minute default.
      - name: Deploy (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 120000

      - name: Wait before attempt 2
        if: ${{ steps.deploy1.outcome == 'failure' }}
        run: sleep 30

      - name: Deploy (attempt 2)
        id: deploy2
        if: ${{ steps.deploy1.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 120000

      # An "in progress deployment" conflict was still present 63 s after a cancel in V1's history.
      - name: Wait before attempt 3
        if: ${{ steps.deploy2.outcome == 'failure' }}
        run: sleep 90

      - name: Deploy (attempt 3)
        id: deploy3
        if: ${{ steps.deploy2.outcome == 'failure' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 300000

      # Informational only: a CDN that is slow to update must not turn a good deploy red.
      - name: Verify the live site serves this run
        run: |
          set -euo pipefail
          base="${SITE_URL%/}/"
          for i in $(seq 1 12); do
            id="$(curl -fsS --max-time 10 "${base}data/v2/status.json?t=$(date +%s)${i}" | jq -r '.run.id // empty' 2>/dev/null || true)"
            # Whatever the site answered is only ever printed as a number.
            if ! [[ "$id" =~ ^[0-9]{1,20}$ ]]; then id=""; fi
            if [ "$id" = "${GITHUB_RUN_ID}" ]; then
              echo "Live site serves run ${GITHUB_RUN_ID}."
              exit 0
            fi
            sleep 10
          done
          echo "::warning title=deploy verify::${base}data/v2/status.json did not report run ${GITHUB_RUN_ID} within 2 minutes (last seen run id: ${id:-none})"

  # ------------------------------------------------------------------------------------------------
  # The state for the next build (its primary - by default its only - source, see the header). Runs
  # whenever the build and gate passed, even if the deploy failed. Runs no npm code and never
  # checks out the repository. The `data` branch is rewritten as a single orphan commit each time,
  # so it never grows. Never touches main.
  persist:
    name: Persist state to the data branch
    needs: [build, deploy]
    if: ${{ !cancelled() && vars.V2_DEPLOY == 'true' && github.ref == 'refs/heads/main' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download state artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: v2-state
          path: ${{ runner.temp }}/v2-state

      - name: Force-push one orphan commit to the data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SRC: ${{ runner.temp }}/v2-state
        run: |
          set -euo pipefail
          if ! jq -e 'type == "object" and .schemaVersion == 2' "$SRC/state.json" > /dev/null 2>&1; then
            echo "::error title=persist::state.json is missing or not a schemaVersion 2 state file - not persisting"
            exit 1
          fi

          work="$(mktemp -d)"
          cd "$work"
          git init --quiet --initial-branch=data
          cp "$SRC/state.json" state.json
          git add -- state.json
          if [ -s "$SRC/status.json" ]; then
            cp "$SRC/status.json" status.json
            git add -- status.json
          fi
          stamp="$(date -u +%FT%TZ)"
          {
            echo "# AI DRUDGE V2 state snapshot"
            echo
            echo "Machine-written by the \"V2 refresh and deploy\" workflow. This branch is ONE orphan commit,"
            echo "force-pushed on every successful build. Do not edit, branch from or merge it."
            echo
            echo "Written ${stamp} by run ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})."
          } > README.md
          git add -- README.md
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "data: state ${stamp} (run ${GITHUB_RUN_ID})"

          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git push --force --quiet "$remote" HEAD:refs/heads/data; then
              echo "Pushed one orphan commit to refs/heads/data (attempt ${attempt})."
              exit 0
            fi
            echo "Push attempt ${attempt} failed."
            sleep $(( attempt * 10 ))
          done
          echo "::error title=persist::could not push the state snapshot to the data branch"
          exit 1

  # ------------------------------------------------------------------------------------------------
  # Two rolling issues, each opened once, commented on at a bounded rate and closed automatically:
  #   "V2 refresh failing"      a job failed, or the build found no saved state although the site
  #                             is up. Commented on at most every 3 hours; closed by the next fully
  #                             successful run that also restored its state.
  #   "V2 Daily Brief failing"  the gate's brief alert: the Claude brief failed six builds in a row
  #                             WITH a key configured (the site itself is fine). At most one comment
  #                             a day; closed by the first build whose gate raises no brief alert.
  #                             Without an ANTHROPIC_API_KEY there is never an alert.
  # Every value reaches the scripts through the environment; nothing is interpolated into the
  # script text. Production (main) runs only: a test dispatch on another ref neither deploys nor
  # reports. A run the owner cancelled by hand is not a failure: it neither opens, updates nor
  # closes an issue (a job that hits its own timeout also reports "cancelled", but does not cancel
  # the workflow, so it still alerts).
  alert:
    name: Failure issue (open, update, close)
    needs: [guard, build, deploy, persist]
    if: >-
      ${{ always() && vars.V2_DEPLOY == 'true' && github.ref == 'refs/heads/main' &&
          (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.deploy.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Note a manual cancellation
        if: ${{ cancelled() }}
        run: echo "This run was cancelled by hand - the failure issue is left untouched."

      # Status functions are only valid in `if:`, so the cancellation test lives here, not in env.
      - name: Open, update or close the rolling issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          R_BUILD: ${{ needs.build.result }}
          R_DEPLOY: ${{ needs.deploy.result }}
          R_PERSIST: ${{ needs.persist.result }}
          FAILED_STEP: ${{ needs.build.outputs.failed_step }}
          STATE_LOST: ${{ needs.build.outputs.state_lost }}
          COMMENT_EVERY_MINUTES: "180"
        run: |
          set -euo pipefail
          title="V2 refresh failing"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          bad=""
          for pair in "build:${R_BUILD}" "deploy:${R_DEPLOY}" "persist:${R_PERSIST}"; do
            case "${pair#*:}" in
              failure) bad="${bad}${bad:+, }${pair%%:*} (failed)" ;;
              cancelled) bad="${bad}${bad:+, }${pair%%:*} (cancelled or timed out)" ;;
            esac
          done
          # The run can be green and still have lost its memory: the build found no saved state
          # although the site is up. That is reported like a failure until a run restores its state.
          if [ "$STATE_LOST" = true ]; then
            bad="${bad}${bad:+, }state restore (no saved state found - built from empty)"
          fi

          # The rolling issue is the open one with this exact title that a bot opened. Listing (not
          # search) is strongly consistent, so two failing runs in a row cannot open two issues.
          if ! found="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null and .user.type == "Bot" and .title == "V2 refresh failing") | "\(.number) \(.updated_at)"')"; then
            echo "::warning title=alert::could not list issues - not opening, updating or closing anything"
            exit 0
          fi
          line="$(printf '%s\n' "$found" | sed -n 1p)"
          number="${line%% *}"
          updated="${line#* }"

          if [ -n "$bad" ]; then
            ref="$(printf '%s' "${GITHUB_REF_NAME}" | tr -cd 'A-Za-z0-9._/-')"
            body="$(mktemp)"
            {
              echo "The V2 refresh needs attention: ${bad}."
              echo
              echo "- Run: ${run_url} (attempt ${GITHUB_RUN_ATTEMPT})"
              echo "- Trigger: ${GITHUB_EVENT_NAME} on \`${ref}\` at \`${GITHUB_SHA:0:7}\`"
              if [ "$R_BUILD" != success ] && [ -n "$FAILED_STEP" ]; then
                echo "- Build stopped at: ${FAILED_STEP}"
              fi
              if [ "$R_BUILD" != success ]; then
                echo "- Effect: nothing was deployed; the previous deploy keeps serving and goes stale."
              elif [ "$R_DEPLOY" = failure ] || [ "$R_DEPLOY" = cancelled ]; then
                echo "- Effect: the data passed the gate but all deploy attempts failed; the previous deploy keeps serving."
              elif [ "$R_PERSIST" = failure ] || [ "$R_PERSIST" = cancelled ]; then
                echo "- Effect: the site was refreshed, but this build's state was not saved to the data branch. The next build continues from the previous snapshot (stories first seen in this build are stamped again), or from empty if there is none."
              else
                echo "- Effect: the site was refreshed."
              fi
              if [ "$STATE_LOST" = true ]; then
                echo "- State: the site is up, but no valid state.json was found on the data branch (or on the live site), so this build started from empty: first-seen times are re-stamped, and feed failure streaks, the 7-day river memory and conditional-GET validators are gone. One such build after a failed persist is harmless. If it repeats, check the persist job and the data branch, and set the repository variable V2_PUBLISH_STATE=true: the state is then also published with the site and restored from there."
              fi
              echo
              echo "_Updated at most every ${COMMENT_EVERY_MINUTES} minutes while the failure lasts. Closed automatically by the next fully successful run._"
            } > "$body"

            if [ -z "$number" ]; then
              gh issue create --title "$title" --body-file "$body" --assignee "${GITHUB_REPOSITORY_OWNER}" \
                || gh issue create --title "$title" --body-file "$body"
              exit 0
            fi

            age=999999
            if [[ "$updated" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
              age=$(( ( $(date -u +%s) - $(date -u -d "$updated" +%s) ) / 60 ))
            fi
            if [ "$age" -ge "$COMMENT_EVERY_MINUTES" ]; then
              gh issue comment "$number" --body-file "$body"
            else
              echo "Issue #${number} was updated ${age} min ago - not commenting again yet. Still failing: ${bad}."
            fi
            exit 0
          fi

          if [ "$R_BUILD" = success ] && [ "$R_DEPLOY" = success ] && [ "$R_PERSIST" = success ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Recovered: ${run_url} restored its state, built, deployed and persisted state successfully. Closing."
              echo "Closed issue #${number}."
            else
              echo "Run succeeded and no failure issue is open."
            fi
          else
            echo "Nothing to report (build=${R_BUILD}, deploy=${R_DEPLOY}, persist=${R_PERSIST})."
          fi

      # The gate writes `brief_alert` on every run it completes: the alert line, or empty. Only a
      # line of exactly the gate's shape is acted on, and only its number and its reason code
      # (lower-case letters, digits, hyphens) are repeated in the issue.
      - name: Open, update or close the Daily Brief issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          R_BUILD: ${{ needs.build.result }}
          BRIEF_ALERT: ${{ needs.build.outputs.brief_alert }}
          COMMENT_EVERY_MINUTES: "1440"
        run: |
          set -euo pipefail
          title="V2 Daily Brief failing"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          streak=""
          reason=""
          shape='^brief: the Claude brief has failed ([0-9]{1,6}) builds in a row \(([a-z0-9][a-z0-9-]{0,23})\) '
          if [[ "$BRIEF_ALERT" =~ $shape ]]; then
            streak="${BASH_REMATCH[1]}"
            reason="${BASH_REMATCH[2]}"
          elif [ -n "$BRIEF_ALERT" ]; then
            echo "::warning title=brief alert::the gate wrote a brief alert this job does not recognise - ignored"
          fi

          if ! found="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null and .user.type == "Bot" and .title == "V2 Daily Brief failing") | "\(.number) \(.updated_at)"')"; then
            echo "::warning title=brief alert::could not list issues - not opening, updating or closing anything"
            exit 0
          fi
          line="$(printf '%s\n' "$found" | sed -n 1p)"
          number="${line%% *}"
          updated="${line#* }"

          if [ -n "$streak" ]; then
            body="$(mktemp)"
            {
              echo "Claude has not written the Daily Brief for ${streak} builds in a row (reason code \`${reason}\`), although an ANTHROPIC_API_KEY is configured. The site keeps refreshing; it shows no Daily Brief."
              echo
              echo "- Run: ${run_url}"
              echo "- Reason codes: \`http-4xx\` = the API rejected the request (expired or revoked key, retired model id, rejected parameter); \`http-5xx\`, \`timeout\`, \`network\` = the API could not be reached; \`refusal\`, \`truncated\`, \`invalid-reply\` = the reply could not be used."
              echo "- Detail: the API's own error text is in the \"Build data\" step log of the run (lines starting with \"brief:\"). It is never published."
              echo "- To stop these alerts without fixing the brief, remove the ANTHROPIC_API_KEY secret: without a key the deterministic brief is used and nothing is reported."
              echo
              echo "_Commented on at most once a day while it lasts. Closed automatically by the first build whose gate raises no brief alert._"
            } > "$body"

            if [ -z "$number" ]; then
              gh issue create --title "$title" --body-file "$body" --assignee "${GITHUB_REPOSITORY_OWNER}" \
                || gh issue create --title "$title" --body-file "$body"
              exit 0
            fi
            age=999999
            if [[ "$updated" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
              age=$(( ( $(date -u +%s) - $(date -u -d "$updated" +%s) ) / 60 ))
            fi
            if [ "$age" -ge "$COMMENT_EVERY_MINUTES" ]; then
              gh issue comment "$number" --body-file "$body"
            else
              echo "Issue #${number} was updated ${age} min ago - not commenting again yet. Still failing: ${streak} builds (${reason})."
            fi
            exit 0
          fi

          # No alert. Only a build whose gate ran can say the brief is fine (or that there is no key).
          if [ "$R_BUILD" = success ] && [ -z "$BRIEF_ALERT" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Recovered: the gate of ${run_url} raised no Daily Brief alert. Closing."
              echo "Closed issue #${number}."
            else
              echo "No Daily Brief alert and no issue open."
            fi
          else
            echo "Nothing to report for the Daily Brief (build=${R_BUILD})."
          fi
